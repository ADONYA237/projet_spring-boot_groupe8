spring.application.name=ecommerce-core
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=user_ecommerce
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration (SMTP - configurer selon l'environnement)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.ecommerce@gmail.com
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Mail sender identity
app.mail.from=noreply.ecommerce@gmail.com
app.mail.from-name=E-Commerce Shop

# Thymeleaf Configuration
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Internationalization (i18n)
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.web.locale=en
spring.web.locale-resolver=fixed
