<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.orders} + ' | AfriShop'">Orders Management - AfriShop</title>
    <link rel="stylesheet" th:href="@{/css/tailwind-custom.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="flex h-screen bg-light-cream">
        <!-- Sidebar -->
        <aside class="w-64 bg-dark-brown text-light-cream shadow-lg">
            <div class="p-6 border-b border-gray-700">
                <h1 class="text-2xl font-bold text-primary-gold flex items-center gap-2">
                    <i class="fas fa-leaf"></i> AfriShop Admin
                </h1>
            </div>

            <nav class="p-4 space-y-2">
                <a th:href="@{/admin}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-light-cream hover:bg-primary-orange transition">
                    <i class="fas fa-chart-line"></i> <span th:text="#{admin.dashboard}">Dashboard</span>
                </a>
                <a th:href="@{/admin/products}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-light-cream hover:bg-primary-orange transition">
                    <i class="fas fa-box"></i> <span th:text="#{admin.products}">Products</span>
                </a>
                <a th:href="@{/admin/categories}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-light-cream hover:bg-primary-orange transition">
                    <i class="fas fa-list"></i> <span th:text="#{admin.categories}">Categories</span>
                </a>
                <a th:href="@{/admin/orders}" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary-orange text-white transition">
                    <i class="fas fa-shopping-cart"></i> <span th:text="#{admin.orders}">Orders</span>
                </a>
                <a th:href="@{/admin/users}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-light-cream hover:bg-primary-orange transition">
                    <i class="fas fa-users"></i> <span th:text="#{admin.users}">Users</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto">
            <!-- Top Bar -->
            <div class="bg-white border-b border-warm-beige p-6 flex-between shadow-sm">
                <div>
                    <h1 class="text-3xl font-bold text-primary-orange" th:text="#{admin.orders}">Orders</h1>
                    <p class="text-gray-dark text-sm mt-1">Manage customer orders and shipments</p>
                </div>

                <button class="btn-primary flex items-center gap-2">
                    <i class="fas fa-download"></i> <span>Export</span>
                </button>
            </div>

            <!-- Content -->
            <div class="p-6">
                <!-- Filters -->
                <div class="card p-6 mb-8">
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <input type="text" placeholder="Search orders..." class="form-control" th:placeholder="#{common.search}">
                        <select class="form-control">
                            <option value="">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="processing">Processing</option>
                            <option value="shipped">Shipped</option>
                            <option value="delivered">Delivered</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                        <input type="date" class="form-control">
                        <input type="date" class="form-control">
                        <button class="btn-primary" th:text="#{common.filter}">Filter</button>
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="card overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-warm-beige border-b-2 border-primary-gold">
                                    <th class="text-left py-4 px-6 font-bold text-dark-brown">Order ID</th>
                                    <th class="text-left py-4 px-6 font-bold text-dark-brown">Customer</th>
                                    <th class="text-left py-4 px-6 font-bold text-dark-brown">Amount</th>
                                    <th class="text-left py-4 px-6 font-bold text-dark-brown">Items</th>
                                    <th class="text-left py-4 px-6 font-bold text-dark-brown">Status</th>
                                    <th class="text-left py-4 px-6 font-bold text-dark-brown">Date</th>
                                    <th class="text-left py-4 px-6 font-bold text-dark-brown">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="border-b border-warm-beige hover:bg-light-cream transition" th:each="order : ${orders}">
                                    <td class="py-4 px-6 font-bold text-primary-orange" th:text="${order.id}">ORD-001</td>
                                    <td class="py-4 px-6">
                                        <div>
                                            <p class="font-bold text-dark-brown" th:text="${order.customerName}">John Smith</p>
                                            <p class="text-xs text-gray-dark" th:text="${order.customerEmail}">john@example.com</p>
                                        </div>
                                    </td>
                                    <td class="py-4 px-6 font-bold text-primary-orange" th:text="'$' + ${order.totalAmount}">$245.50</td>
                                    <td class="py-4 px-6 text-gray-dark" th:text="${order.itemCount}">3</td>
                                    <td class="py-4 px-6">
                                        <span class="badge" th:classappend="${order.status == 'delivered'} ? 'badge-success' : ${order.status == 'processing'} ? 'badge-warning' : 'badge-primary'" th:text="${order.status}">Delivered</span>
                                    </td>
                                    <td class="py-4 px-6 text-gray-dark text-sm" th:text="${#dates.format(order.createdDate, 'yyyy-MM-dd')}">2024-05-10</td>
                                    <td class="py-4 px-6">
                                        <div class="flex gap-2">
                                            <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="text-primary-orange hover:text-primary-rust transition" title="View">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <button class="text-primary-orange hover:text-primary-rust transition" title="Edit Status">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="text-red-500 hover:text-red-700 transition" title="Cancel">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="bg-warm-beige p-4 flex-between">
                        <p class="text-sm text-gray-dark">Showing <span class="font-bold">1-10</span> of <span class="font-bold">156</span> orders</p>
                        <div class="pagination">
                            <a href="#" class="hover:bg-primary-orange hover:text-white">&laquo;</a>
                            <a href="#" class="active">1</a>
                            <a href="#" class="hover:bg-primary-orange hover:text-white">2</a>
                            <a href="#" class="hover:bg-primary-orange hover:text-white">3</a>
                            <a href="#" class="hover:bg-primary-orange hover:text-white">&raquo;</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
