openapi: 3.0.0
info:
  title: E-Commerce Core API
  description: |
    API complète pour la gestion d'un e-commerce Spring Boot.
    Inclut la gestion des produits, commandes, utilisateurs, tickets de support et promotions.
    La configuration mail (SMTP, expéditeur) est gérée dans `application.properties`.
  version: 4.0.0

servers:
  - url: http://localhost:8081/api/v1
    description: Serveur de développement

tags:
  - name: Products
  - name: Categories
  - name: Users
  - name: Orders
  - name: Tickets
  - name: Promotions
  - name: System

paths:

  # ==================== PRODUCTS ====================
  /products:
    get:
      tags: [Products]
      summary: Liste et recherche avancée de produits
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: "Recherche par nom ou description" }
        - { name: category, in: query, schema: { type: string }, description: "Filtrer par nom de catégorie" }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: Liste paginée des produits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags: [Products]
      summary: Créer un nouveau produit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              name: "iPhone 15"
              description: "Dernier smartphone Apple"
              price: 1200.0
              stockQuantity: 10
              categories:
                - { id: 1, name: "Électronique" }
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'

  /products/{id}:
    get:
      tags: [Products]
      summary: Obtenir un produit par son ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Détails du produit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Products]
      summary: Mettre à jour un produit
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Products]
      summary: Supprimer un produit
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204':
          description: Produit supprimé
        '400':
          $ref: '#/components/responses/NotFound'

  /products/{id}/variants:
    post:
      tags: [Products]
      summary: Ajouter une variante à un produit (couleur, taille…)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariant'
            example:
              type: "Couleur"
              value: "Rouge"
              priceAdjustment: 0.0
      responses:
        '200':
          description: Variante ajoutée, produit retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{id}/comments:
    post:
      tags: [Products]
      summary: Ajouter un commentaire / avis à un produit
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
            example:
              userId: 1
              content: "Excellent produit !"
              rating: 5
      responses:
        '200':
          description: Commentaire ajouté, produit retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  # ==================== CATEGORIES ====================
  /categories:
    get:
      tags: [Categories]
      summary: Liste toutes les catégories
      responses:
        '200':
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

    post:
      tags: [Categories]
      summary: Créer une catégorie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
            example:
              name: "Électronique"
              description: "Appareils high-tech"
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Obtenir une catégorie par son ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Détails de la catégorie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/NotFound'

  # ==================== USERS ====================
  /users:
    get:
      tags: [Users]
      summary: Liste tous les utilisateurs
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      tags: [Users]
      summary: Créer un utilisateur (avec validation numéro camerounais)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            examples:
              valid:
                summary: Numéro valide (+237)
                value:
                  username: "jean_dupont"
                  email: "jean@example.cm"
                  password: "password123"
                  phoneNumber: "+237670000000"
                  role: "CUSTOMER"
              invalid_phone:
                summary: Numéro invalide (retourne 400)
                value:
                  username: "bad_phone"
                  email: "bad@example.com"
                  password: "password123"
                  phoneNumber: "+33123456789"
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtenir un utilisateur par son ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Détails de l'utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NotFound'

  # ==================== ORDERS ====================
  /orders:
    get:
      tags: [Orders]
      summary: Liste toutes les commandes
      responses:
        '200':
          description: Liste des commandes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      tags: [Orders]
      summary: Créer une commande
      description: |
        Crée une commande, décrémente le stock, applique un code promo si fourni.
        La commande est créée avec le statut `PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              userId: 1
              address: "Douala, Cameroun"
              promoCode: "PROMO10"
              items:
                - productId: 1
                  quantity: 2
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Obtenir une commande par son ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Détails de la commande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/pay:
    post:
      tags: [Orders]
      summary: Payer une commande
      description: |
        Passe la commande en statut `PAID`.
        Génère automatiquement une facture PDF et l'envoie par email à l'utilisateur.
        La configuration SMTP est définie dans `application.properties` (non paramétrable via l'API).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Commande payée, facture envoyée par email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/shipping:
    patch:
      tags: [Orders]
      summary: Mettre à jour le statut de livraison
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShippingRequest'
            example:
              status: "SHIPPED"
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'

  # ==================== TICKETS ====================
  /tickets:
    get:
      tags: [Tickets]
      summary: Liste tous les tickets de support
      responses:
        '200':
          description: Liste des tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'

    post:
      tags: [Tickets]
      summary: Créer un ticket de support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
            example:
              userId: 1
              subject: "Problème de livraison"
              message: "Ma commande n'est toujours pas arrivée."
      responses:
        '201':
          description: Ticket créé avec statut OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Obtenir un ticket par son ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Détails du ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/NotFound'

  /tickets/{id}/close:
    patch:
      tags: [Tickets]
      summary: Fermer un ticket de support
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Ticket fermé (statut CLOSED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/NotFound'

  # ==================== PROMOTIONS ====================
  /promotions:
    get:
      tags: [Promotions]
      summary: Liste toutes les promotions
      responses:
        '200':
          description: Liste des promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'

    post:
      tags: [Promotions]
      summary: Créer un code promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Promotion'
            example:
              code: "PROMO10"
              discountPercentage: 10.0
              isActive: true
      responses:
        '201':
          description: Promotion créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'

  # ==================== SYSTEM ====================
  /stats:
    get:
      tags: [System]
      summary: Statistiques globales du système
      description: Retourne le nombre total de produits, commandes, utilisateurs, revenus, tickets et répartition des statuts de commande.
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalProducts: { type: integer }
                  totalOrders: { type: integer }
                  totalUsers: { type: integer }
                  totalCategories: { type: integer }
                  totalTickets: { type: integer }
                  openTickets: { type: integer }
                  totalPromotions: { type: integer }
                  totalRevenue: { type: number }
                  ordersByStatus: { type: object }

  /resources:
    get:
      tags: [System]
      summary: Liste tous les endpoints et modèles disponibles
      responses:
        '200':
          description: Ressources disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  endpoints:
                    type: array
                    items: { type: string }
                  models:
                    type: array
                    items: { type: string }

# ==================== COMPONENTS ====================
components:

  responses:
    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
          example:
            phoneNumber: "Invalid Cameroon phone number"
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Product not found: 99"

  schemas:

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        stockQuantity: { type: integer }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        images:
          type: array
          items: { type: string }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }

    ProductCreate:
      type: object
      required: [name, price]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        stockQuantity: { type: integer, minimum: 0 }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        images:
          type: array
          items: { type: string }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    ProductVariant:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "Couleur" }
        value: { type: string, example: "Rouge" }
        priceAdjustment: { type: number, default: 0.0 }

    Comment:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        content: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }

    CommentCreate:
      type: object
      required: [userId, content, rating]
      properties:
        userId: { type: integer }
        content: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, CUSTOMER] }
        phoneNumber: { type: string, example: "+237670000000" }

    UserCreate:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        role: { type: string, enum: [ADMIN, CUSTOMER], default: CUSTOMER }
        phoneNumber:
          type: string
          description: "Numéro camerounais (+237XXXXXXXXX)"
          example: "+237670000000"

    Order:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, DELIVERED]
        totalAmount: { type: number }
        shippingAddress: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    CreateOrderRequest:
      type: object
      required: [userId, items, address]
      properties:
        userId: { type: integer }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemCreate' }
        promoCode: { type: string }
        address: { type: string }

    UpdateShippingRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, DELIVERED]

    OrderItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number }

    OrderItemCreate:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }

    Ticket:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        subject: { type: string }
        message: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        createdAt: { type: string, format: date-time }

    TicketCreate:
      type: object
      required: [userId, subject, message]
      properties:
        userId: { type: integer }
        subject: { type: string }
        message: { type: string }

    Promotion:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: "PROMO10" }
        discountPercentage: { type: number, minimum: 0, maximum: 100 }
        isActive: { type: boolean, default: true }
